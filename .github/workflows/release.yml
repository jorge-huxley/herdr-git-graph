name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  actions: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Tag publishes only after CI has succeeded for the same commit.
  # Push the release commit to main first (or wait for CI), then push the tag.
  ci-gate:
    name: Wait for CI
    runs-on: ubuntu-latest
    steps:
      - name: Require successful CI on tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sha="${GITHUB_SHA}"
          echo "Waiting for workflow CI to succeed on ${sha}…"
          for _ in $(seq 1 90); do
            json="$(gh run list --workflow ci.yml --commit "${sha}" --limit 10 \
              --json status,conclusion,databaseId,url)"
            count="$(printf '%s' "${json}" | jq 'length')"
            if [ "${count}" -eq 0 ]; then
              echo "No CI run yet for this commit; waiting…"
              sleep 10
              continue
            fi

            if printf '%s' "${json}" | jq -e '
              map(select(.status == "completed" and .conclusion == "success")) | length > 0
            ' >/dev/null; then
              printf '%s' "${json}" | jq -r '
                .[] | select(.status == "completed" and .conclusion == "success")
                | "CI green: run \(.databaseId) — \(.url)"
              ' | head -n 1
              exit 0
            fi

            if printf '%s' "${json}" | jq -e '
              map(select(.status == "completed" and .conclusion != "success")) | length > 0
            ' >/dev/null; then
              printf '%s' "${json}" | jq -r '
                .[] | select(.status == "completed" and .conclusion != "success")
                | "CI failed (\(.conclusion)): run \(.databaseId) — \(.url)"
              ' | head -n 1
              exit 1
            fi

            echo "CI still in progress…"
            sleep 10
          done
          echo "Timed out waiting for CI (≈15 minutes)."
          exit 1

  build:
    name: Build ${{ matrix.target }}
    needs: ci-gate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            source: target/x86_64-unknown-linux-musl/release/herdr-git-graph
          - os: macos-15-intel
            target: x86_64-apple-darwin
            source: target/x86_64-apple-darwin/release/herdr-git-graph
          - os: macos-15
            target: aarch64-apple-darwin
            source: target/aarch64-apple-darwin/release/herdr-git-graph
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            source: target/x86_64-pc-windows-msvc/release/herdr-git-graph.exe

    steps:
      - uses: actions/checkout@v4

      - name: Verify tag matches package and plugin versions
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          cargo_version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)"
          plugin_version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' herdr-plugin.toml | head -n 1)"
          test "$version" = "$cargo_version"
          test "$version" = "$plugin_version"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl tools
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Stage release asset
        shell: bash
        run: |
          mkdir dist
          cp "${{ matrix.source }}" "dist/herdr-git-graph-${{ matrix.target }}"

      - uses: actions/upload-artifact@v4
        with:
          name: herdr-git-graph-${{ matrix.target }}
          path: dist/herdr-git-graph-${{ matrix.target }}
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create checksums
        working-directory: dist
        run: sha256sum herdr-git-graph-* > SHA256SUMS

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}"
          dist/herdr-git-graph-*
          dist/SHA256SUMS
          --repo "${GITHUB_REPOSITORY}"
          --title "herdr-git-graph ${GITHUB_REF_NAME}"
          --generate-notes
          --verify-tag
